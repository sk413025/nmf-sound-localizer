roles:
  full_solver:
    canonical_term: physics-guided neural solver
    display_full: full physics-aware solver
    display_short: guided solver
    legacy_display_variants:
      - Physics-aware AI
      - Baseline
      - solver
    notes: Use for the full learned method when contrasted with ablations or classical references; the shared in-panel compact label is `guided solver`.

  no_transformer_ablation:
    canonical_term: router-bypass ablation
    display_full: router-bypass ablation
    display_short: router-bypass
    legacy_display_variants:
      - No transformer
      - No trans.
      - no-transformer
    notes: Use for the ablation that removes transformer routing while keeping the experiment-facing `No Transformer` artifact key unchanged.

  analytical_omp_baseline:
    canonical_term: analytical OMP baseline
    display_full: analytical OMP baseline
    display_short: OMP baseline
    legacy_display_variants:
      - OMP
      - OMP baseline
    notes: Use only where the panel intentionally presents the classical OMP reference; prefer `OMP baseline` over bare `OMP` on active Fig. 4-6 surfaces.

  no_type_bias_ablation:
    canonical_term: type-bias component
    display_full: no-type-bias ablation
    display_short: no type bias
    legacy_display_variants:
      - No type bias
    notes: Figure-only label for the ablation that removes the type-bias component; keep local to Fig. 4 rather than promoting it to a paper-wide model family.

  fixed_heuristic_ablation:
    canonical_term: fixed-heuristic routing ablation
    display_full: fixed-heuristic routing ablation
    display_short: fixed heuristic
    legacy_display_variants:
      - Fixed heuristic
    notes: Preserve as a Fig. 4 routing ablation unless a panel explicitly binds the same artifact key to the classical OMP role.

  g_fixed_variant:
    canonical_term: G-fixed routing variant
    display_full: G-fixed routing variant
    display_short: G-fixed
    legacy_display_variants:
      - G-fixed
    notes: Keep as a Fig. 4-only experiment-facing label, not a paper-wide model name.

  g_teacher_variant:
    canonical_term: G-teacher routing variant
    display_full: G-teacher routing variant
    display_short: G-teacher
    legacy_display_variants:
      - G-teacher
    notes: Keep as a Fig. 4-only experiment-facing label, not a paper-wide model name.

  dense_routing_ablation:
    canonical_term: dense-routing ablation
    display_full: dense-routing ablation
    display_short: dense routing
    legacy_display_variants:
      - Dense routing
    notes: Figure-only label for the Fig. 4 ablation that disables sparse routing.

  h_physical_structure:
    canonical_term: physical encoder
    display_full: H physical structure
    display_short: H structure
    legacy_display_variants: []
    notes: Use for the physical correlation matrix panel; this is a structure label, not a model name.

  qk_learned_structure:
    canonical_term: learned router
    display_full: QK learned structure
    display_short: QK structure
    legacy_display_variants: []
    notes: Use for the learned-router correlation panel; this is a structure label, not a model name.

  omp_selection_reference:
    canonical_term: analytical OMP baseline
    display_full: analytical OMP baseline
    display_short: OMP baseline
    legacy_display_variants:
      - OMP
      - OMP selection
    notes: Derived OMP-like selection or routing reference used in figure panels; treat as a panel comparison role rather than a separate trained system.

figures:
  fig04:
    panels:
      c:
        bindings:
          Baseline: full_solver
          No Type Bias: no_type_bias_ablation
          No Transformer: no_transformer_ablation
          Fixed Heuristic: fixed_heuristic_ablation
          G-Fixed: g_fixed_variant
          G-Teacher: g_teacher_variant
          Dense Routing: dense_routing_ablation

  fig05:
    panels:
      a:
        bindings:
          Baseline: full_solver
          No Transformer: no_transformer_ablation
          Fixed Heuristic: analytical_omp_baseline
      b:
        bindings:
          physical_matrix: h_physical_structure
          learned_matrix: qk_learned_structure
      c:
        bindings:
          omp_side: analytical_omp_baseline
          learned_side: full_solver
      d:
        bindings:
          baseline_cm: full_solver
          no_transformer_cm: no_transformer_ablation
      e:
        bindings:
          baseline_dist: full_solver
          no_transformer_dist: no_transformer_ablation
      f:
        bindings:
          baseline_line: full_solver
          no_transformer_line: no_transformer_ablation

  fig06:
    panels:
      c:
        bindings:
          omp_boxplot: analytical_omp_baseline
          solver_boxplot: full_solver
      e:
        bindings:
          omp_bandwise: analytical_omp_baseline
          learned_bandwise: full_solver
