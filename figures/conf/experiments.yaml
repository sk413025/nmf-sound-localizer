# Primary machine-readable figure contract for the active six-figure manuscript.
# Each figure entry owns the executable metadata needed to:
# - resolve the manuscript-facing asset
# - trace the generator or composition path
# - define panel order and manifests
# - track panel-level provenance where panels are mixed or partially manual
# - support review and regression tooling without a parallel figure registry contract

snr_levels: ["0dB", "5dB", "10dB", "15dB", "20dB", "30dB", "Clean"]

fig01_manual:
  figure_id: fig01
  figure: "Fig 1"
  title: "Direction-Dependent Structural Filtering"
  type: mixed_composite
  manuscript_asset: paper/figures/fig01_paradigm-shift.jpg
  asset_layer: manuscript_composite
  provenance_mode: mixed_composite
  width_mode: double
  manuscript_anchor: "Results / Fig. 1"
  claim: "Single-point structural response produces direction-specific spectral fingerprints."
  legend_summary: "Setup photo, physical principle schematic, and generator-backed spectral evidence."
  panel_order: ["a", "b", "c", "d", "e"]
  panel_manifest: figures/output/fig01_paradigm_shift_panels/fig01_panel_manifest.json
  generator: figures/generators/fig01_paradigm_data.py
  compose_script: scripts/paper/compose_master_figure3_family.py
  generator_outputs:
    - figures/output/fig01_paradigm_data.pdf
    - figures/output/fig01_paradigm_data.tiff
  data_artifacts:
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
      type: npz
      description: "Dictionary used by the directivity and spectral-shaping evidence panels."
    - path: figures/conf/paths.yaml
      type: yaml
      description: "Resolves the white-noise dataset and primary run used by the generator."
  panel_provenance:
    a:
      title: "Experimental setup"
      provenance_mode: manual_support
      asset_path: figures/output/fig01_paradigm_shift_panels/fig01_panel_a_experimental_setup.png
      note: "Committed setup support panel; no data generator or run artifact."
    b:
      title: "Spectral fingerprint schematic"
      provenance_mode: manual_support
      asset_path: figures/output/fig01_paradigm_shift_panels/fig01_panel_b_spectral_fingerprint.png
      note: "Committed physical-mechanism schematic; no data generator or run artifact."
    c:
      title: "Input-output spectral shaping"
      provenance_mode: data_backed
      asset_path: figures/output/fig01_paradigm_data_panels/fig01_panel_c_input_output.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
        - figures/conf/paths.yaml
    d:
      title: "Trial repeatability"
      provenance_mode: data_backed
      asset_path: figures/output/fig01_paradigm_data_panels/fig01_panel_d_repeatability.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
        - figures/conf/paths.yaml
    e:
      title: "Frequency-dependent directivity"
      provenance_mode: data_backed
      asset_path: figures/output/fig01_paradigm_data_panels/fig01_panel_e_directivity.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
        - figures/conf/paths.yaml
  note: "Panels a-b are manual support assets; panels c-e are generator-backed."

