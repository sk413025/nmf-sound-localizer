  manuscript_asset: paper/figures/fig04_solver-dynamics.jpg
  asset_layer: manuscript_composite
  provenance_mode: mixed_composite
  width_mode: double
  manuscript_anchor: "Results / Fig. 4"
  claim: "The physics-guided solver converts broad physical correlations g_t into gated sparse updates Δx_t through learned QK routing, exposes those updates on the angle axis through explicit mode-to-angle aggregation, and then reduces the residual through staged dictionary-consistent updates."
  legend_summary: "Architecture, routing formation, gated-update plus residual correction, an explicit aggregation bridge from mode-resolved routing to angle-axis quantities, and clean-condition routing-mechanism ablation."
  panel_order: ["a", "b", "c", "d", "e"]
  panel_manifest: figures/output/fig04_solver_dynamics_manuscript_panels/fig04_panel_manifest.json
