# Structured experiment metadata for active six-figure provenance auditing.
# Each entry links an active manuscript figure to its generator, upstream runs,
# and manuscript-facing evidence artifacts.

snr_levels: ["0dB", "5dB", "10dB", "15dB", "20dB", "30dB", "Clean"]

fig01_manual:
  figure: "Fig 1"
  title: "Direction-Dependent Structural Filtering"
  type: mixed_composite
  generator: figures/generators/fig01_paradigm_data.py
  asset: paper/figures/fig01_paradigm-shift.jpg
  data_artifacts:
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
      type: npz
      description: "Dictionary used by the directivity and spectral-shaping evidence panels."
    - path: figures/conf/paths.yaml
      type: yaml
      description: "Resolves the white-noise dataset and primary run used by the generator."
  panel_provenance:
    a:
      provenance_mode: manual_support
      asset_path: figures/output/fig01_paradigm_shift_panels/fig01_panel_a_experimental_setup.png
      note: "Committed setup support panel; no data generator or run artifact."
    b:
      provenance_mode: manual_support
      asset_path: figures/output/fig01_paradigm_shift_panels/fig01_panel_b_spectral_fingerprint.png
      note: "Committed physical-mechanism schematic; no data generator or run artifact."
    c:
      provenance_mode: data_backed
      asset_path: figures/output/fig01_paradigm_data_panels/fig01_panel_c_input_output.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
        - figures/conf/paths.yaml
    d:
      provenance_mode: data_backed
      asset_path: figures/output/fig01_paradigm_data_panels/fig01_panel_d_repeatability.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
        - figures/conf/paths.yaml
    e:
      provenance_mode: data_backed
      asset_path: figures/output/fig01_paradigm_data_panels/fig01_panel_e_directivity.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
        - figures/conf/paths.yaml
  note: "Panels a-b are manual support assets; panels c-e are generator-backed."

fig02_svd:
  figure: "Fig 2"
  title: "Structured Physical Dictionary"
  generator: figures/generators/fig02_svd_spectrum.py
  branch: feature/omp-transformer-modal-viz
  branch_tip_commit: "15b2981"
  data_artifacts:
    - path: h_matrix_normalized_original_to_box.pth
      type: pth
      description: "Normalized H matrix used for SVD and dictionary construction."

fig03_discriminability:
  figure: "Fig 3"
  title: "Discriminability And Classical OMP Failure"
  generator: figures/generators/fig03_fingerprint_discriminability.py
  primary_run:
    dir: results/omp_transformer_speech260_trainval_split_full_20251115_082341
    code_state_git_head: "3785b1f"
  data_artifacts:
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
      type: npz
      keys: [D, H, W_reduced, W_full, angles, idx2angle, atom_labels]
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/modal_routing_val.npz
      type: npz
      keys: [labels, angles_deg, scores_expert, scores_atoms, g_energy_expert, Y_val, selected_counts, selected_mask]
    - path: results/speech_babble_omp_snr_sweep.json
      type: json
      description: "Speech-plus-babble OMP sweep used in the dose-response panel."
    - path: figures/conf/paths.yaml
      type: yaml
      description: "Resolves the white-noise dataset and SNR sweep inputs."

fig04_ablation:
  figure: "Fig 4"
  title: "Solver Dynamics"
  generator: figures/generators/fig04_solver_dynamics.py
  display_crosswalk: figures/conf/model_display_crosswalk.yaml
  naming_provenance_note: figures/conf/fig04_fig06_panel_name_provenance.md
  branch: paper/nature-comm-figures
  experiment_commit: "14feb94"
  commit_message: "Results: Babble Speech260 full sweep (245/245, ep20)"
  worktree: exp-omp-ablation-snr-rerun-20260128
  data_artifacts:
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/metrics.npz
      type: npz
      description: "Primary-run convergence and per-angle metrics."
    - path: results/figure4_data.json
      type: json
      is_symlink: true
      symlink_target: "worktrees/exp-omp-ablation-snr-rerun-20260128/results/figure4_data.json"
      description: "Aggregated clean-condition ablation sweep."
  panel_provenance:
    a:
      provenance_mode: manual_support
      asset_path: paper/figures/fig04_unrolled-attention-omp.jpg
      note: "Committed architecture support panel; no run-generated evidence."
    b:
      provenance_mode: data_backed
      asset_path: figures/output/fig04_solver_dynamics_panels/fig04_panel_b_convergence.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/metrics.npz
    c:
      provenance_mode: data_backed
      asset_path: figures/output/fig04_solver_dynamics_panels/fig04_panel_c_ablation.pdf
      evidence_sources:
        - results/figure4_data.json
    d:
      provenance_mode: data_backed
      asset_path: figures/output/fig04_solver_dynamics_panels/fig04_panel_d_perangle.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/metrics.npz
  sweep:
    noise_type: babble
    variants:
      - Baseline
      - No Transformer
      - No Type Bias
      - Fixed Heuristic
      - Dense Routing
      - G-Teacher
      - G-Fixed
    snr_levels: ["0dB", "5dB", "10dB", "15dB", "20dB", "30dB", "Clean"]
    seeds_per_condition: 5

fig05_performance_structure:
  figure: "Fig 5"
  title: "Performance And Structure"
  generator: figures/generators/fig05_performance_structure.py
  display_crosswalk: figures/conf/model_display_crosswalk.yaml
  naming_provenance_note: figures/conf/fig04_fig06_panel_name_provenance.md
  primary_run:
    dir: results/omp_transformer_speech260_trainval_split_full_20251115_082341
    code_state_git_head: "3785b1f"
    code_state_commit_message: "Results: OMP Transformer Speech260 16 kHz full training (QK + hard Gumbel)"
  data_artifacts:
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/modal_routing_val.npz
      type: npz
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
      type: npz
    - path: results/omp_transformer_speech260_trainval_split_full_20251202_192153/metrics.npz
      type: npz
      description: "Baseline confusion/per-angle metrics used by panels d-f through paths.yaml[confusion_matrix.baseline]."
    - path: results/ablate_identity_speech260_seed42_20251210_134919/metrics.npz
      type: npz
      description: "No-transformer confusion/per-angle metrics used by panels d-f."
  model_params:
    d_model: 128
    nhead: 2
    nlayers: 1
    steps: 2
    no_type_bias: true
    epochs: 20
    batch_size: 32
    lr: 0.001
    device: mps

fig06_universality:
  figure: "Fig 6"
  title: "Universal Physical Encoding Across Diverse Materials"
  generator: figures/generators/fig06_universality.py
  display_crosswalk: figures/conf/model_display_crosswalk.yaml
  naming_provenance_note: figures/conf/fig04_fig06_panel_name_provenance.md
  data_artifacts:
    - path: h_matrix_normalized_original_to_box.pth
      type: pth
      description: "Primary H matrix used for the per-band SVD panel."
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/modal_routing_val.npz
      type: npz
      description: "Primary routing run used for the band-resolved routing panel."
    - path: results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
      type: npz
      description: "Dictionary support for the band-resolved routing panel."
    - path: figures/output/fig06_cross_material_universality_panels/fig06_panel_a_material_exemplars.png
      type: png
      description: "Committed split-panel support asset for material exemplars."
    - path: figures/output/fig06_cross_material_universality_panels/fig06_panel_b_heatmaps.png
      type: png
      description: "Committed split-panel support asset for representative heatmaps."
    - path: figures/output/fig06_cross_material_universality_panels/fig06_panel_c_rmse_comparison.png
      type: png
      description: "Committed split-panel support asset for the cross-material RMSE panel."
  panel_provenance:
    a:
      provenance_mode: provenance_gap
      asset_path: figures/output/fig06_cross_material_universality_panels/fig06_panel_a_material_exemplars.png
      note: "Committed support asset; upstream cross-material raw-source contract is not yet machine-readable."
    b:
      provenance_mode: provenance_gap
      asset_path: figures/output/fig06_cross_material_universality_panels/fig06_panel_b_heatmaps.png
      note: "Committed support asset; upstream cross-material heatmap selection lineage is not yet machine-readable."
    c:
      provenance_mode: provenance_gap
      asset_path: figures/output/fig06_cross_material_universality_panels/fig06_panel_c_rmse_comparison.png
      note: "Committed support asset with normalized display labels but no tracked generator-backed upstream lineage."
    d:
      provenance_mode: data_backed
      asset_path: figures/output/fig06_universality_panels/fig06_panel_d_svd.pdf
      evidence_sources:
        - h_matrix_normalized_original_to_box.pth
    e:
      provenance_mode: data_backed
      asset_path: figures/output/fig06_universality_panels/fig06_panel_e_band_routing.pdf
      evidence_sources:
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/modal_routing_val.npz
        - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
  note: "Panels d-e are generator-backed. Panels a-c remain partially provenance-gapped top-panel support assets pending a stronger machine-readable cross-material contract."
