# Data paths for figure generators.
# All paths are relative to the repository root unless marked absolute.
# Override via environment variable FIGURES_DATA_ROOT if needed.

# Primary training run (Speech260, trainval split, full sweep)
primary_run: results/omp_transformer_speech260_trainval_split_full_20251115_082341

# H matrix for SVD / modal decomposition (Fig 2)
h_matrix: h_matrix_normalized_original_to_box.pth

# Ablation sweep data (Fig 4)
ablation_sweep:
  results_dir: results
  sweep_suffix: babble_speech260_full_20260209_011327
  aggregated_json: results/figure4_data.json

# Confusion-matrix metrics used by the active Fig. 5 confusion panels and the retired supplementary confusion family
confusion_matrix:
  baseline: results/omp_transformer_speech260_trainval_split_full_20251202_192153/metrics.npz
  no_transformer: results/ablate_identity_speech260_seed42_20251210_134919/metrics.npz

# White noise dataset (Fig 3 WN vs Speech comparison)
white_noise_dataset: /Users/sbplab/LDV-data-experiments/snr-synthetic-2025-12/processed-48k/white_noise_box_snrInf_sync_vad_normalized

# SNR sweep datasets for dose-response curve (Fig 3f)
snr_sweep_base: /Users/sbplab/LDV-data-experiments/snr-synthetic-2025-12/processed-48k
snr_sweep_levels:
  - {snr_db: "Inf", dir_suffix: "snrInf"}
  - {snr_db: "30",  dir_suffix: "snr30dB"}
  - {snr_db: "20",  dir_suffix: "snr20dB"}
  - {snr_db: "15",  dir_suffix: "snr15dB"}
  - {snr_db: "10",  dir_suffix: "snr10dB"}
  - {snr_db: "5",   dir_suffix: "snr5dB"}
  - {snr_db: "0",   dir_suffix: "snr0dB"}

# Speech + babble noise OMP SNR sweep (Fig 3f, second line)
speech_babble_omp_snr: results/speech_babble_omp_snr_sweep.json

# Output directories
output_dir: figures/output
paper_figures_dir: paper/figures
