    manuscript_anchor: "Results / Fig. 6"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "The physical encoding mechanism generalizes across structurally distinct materials."
    panel_order: ["a", "b", "c"]
    legend_summary: "Cross-material examples, heatmaps, and RMSE comparison."
    evidence_sources: []
    generator_outputs: []
    provenance_note: "The manuscript asset exists, but the upstream data-backed generator/evidence layer has not yet been registered in machine-readable form. Treat this as a provenance gap, not as a manual-only figure."

  - figure_id: supp_fig09_heatmaps
