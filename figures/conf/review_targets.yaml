    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "Baseline and no-transformer confusion heatmaps reveal class-level routing differences."
    panel_order: ["a"]
    legend_summary: "Supplementary confusion matrix heatmaps."
    evidence_sources:
      - results/omp_transformer_speech260_trainval_split_full_20251202_192153/metrics.npz
      - results/ablate_identity_speech260_seed42_20251210_134919/metrics.npz
    generator_outputs:
      - figures/output/fig09_heatmaps.pdf
      - figures/output/fig09_heatmaps.tiff
    provenance_note: "The review asset is already the deployed generator output."

