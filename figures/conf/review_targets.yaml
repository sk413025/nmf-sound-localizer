    manuscript_path: paper/manuscript/manuscript.md
    manuscript_anchor: "Results / Fig. 3"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "Directional encoding survives content variation even though analytical OMP decoding fails."
    panel_order: ["a", "b", "c", "d", "e", "f"]
    legend_summary: "Discriminability, OMP comparison, pairwise similarity, and dose response."
    panel_manifest: figures/output/fig03_fingerprint_discriminability_panels/fig03_panel_manifest.json
    evidence_sources:
      - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
      - results/omp_transformer_speech260_trainval_split_full_20251115_082341/modal_routing_val.npz
      - results/speech_babble_omp_snr_sweep.json
