# Paper-facing figure assets that require Codex multimodal review.
# All paths are relative to the repository root.

review_dir: figures/review_artifacts
canonical_requirements: docs/nature-communications/nature-communications-submission-requirements.md

targets:
  - figure_id: fig01
    role: main
    asset: paper/figures/fig01_paradigm-shift.jpg
    asset_layer: manuscript_composite
    provenance_mode: manual_illustration
    width_mode: double
    manuscript_section: Results
    manuscript_path: paper/manuscript/manuscript.md
    manuscript_anchor: "Results / Fig. 1"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "Single-point structural response produces direction-specific spectral fingerprints."
    panel_order: ["a", "b"]
    legend_summary: "Experimental setup photograph and spectral fingerprint schematic."
    evidence_sources: []
    generator_outputs: []
    provenance_note: "Manual setup photo plus schematic. No generator-backed upstream asset is expected."

  - figure_id: fig02
    role: main
    asset: paper/figures/fig02_svd-physical-dictionary.jpg
    asset_layer: manuscript_composite
    provenance_mode: data_backed_composite
    width_mode: double
    manuscript_section: Results
    manuscript_path: paper/manuscript/manuscript.md
    manuscript_anchor: "Results / Fig. 2"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "The measured response admits a low-rank spectral-spatial decomposition and a structured dictionary."
    panel_order: ["a", "b", "c"]
    legend_summary: "Singular spectrum, modal decomposition, and structured physical dictionary."
    evidence_sources:
      - h_matrix_normalized_original_to_box.pth
    generator_outputs:
      - figures/output/fig02_svd_spectrum.pdf
      - figures/output/fig02_svd_spectrum.tiff
    provenance_note: "Review the manuscript composite against the upstream generator output. The final asset should preserve data-backed content without slide-style adornments."

  - figure_id: fig03
    role: main
    asset: paper/figures/fig03_unrolled-attention-omp.jpg
    asset_layer: manuscript_composite
    provenance_mode: manual_illustration
    width_mode: double
    manuscript_section: Results
    manuscript_path: paper/manuscript/manuscript.md
    manuscript_anchor: "Results / Fig. 3"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "The inference model is a physics-guided unrolled architecture with attention-based routing."
    panel_order: ["a"]
    legend_summary: "Full-page architecture diagram of the unrolled OMP-transformer."
    evidence_sources: []
    generator_outputs: []
    provenance_note: "Manual architecture diagram. No data-backed upstream asset is expected."

  - figure_id: fig04
    role: main
    asset: paper/figures/fig04_noise-robustness-ablation.jpg
    asset_layer: manuscript_composite
    provenance_mode: data_backed_composite
    width_mode: double
    manuscript_section: Results
    manuscript_path: paper/manuscript/manuscript.md
    manuscript_anchor: "Results / Fig. 4"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "Performance remains robust under additive noise and degrades under architectural ablations."
    panel_order: ["a", "b"]
    legend_summary: "Noise robustness and ablation comparison."
    evidence_sources:
      - results/figure4_data.json
    generator_outputs:
      - figures/output/fig04_snr_ablation.pdf
      - figures/output/fig04_snr_ablation.tiff
    provenance_note: "This manuscript asset should remain traceable to the ablation sweep summary and the clean generator outputs."

  - figure_id: fig05
    role: main
    asset: paper/figures/fig05_routing-mechanism-analysis.png
    asset_layer: manuscript_composite
    provenance_mode: data_backed_composite
    width_mode: double
    manuscript_section: Results
    manuscript_path: paper/manuscript/manuscript.md
    manuscript_anchor: "Results / Fig. 5"
    legend_path: paper/figures/Figure-Legends.md
    registry_path: figures/FIGURE_REGISTRY.md
    claim: "Routing exhibits coherent structure across global, micro, and macro scales."
    panel_order: ["a", "b", "c"]
    legend_summary: "Global routing structure, micro-mechanism case study, and macro selection statistics."
    evidence_sources:
      - results/omp_transformer_speech260_trainval_split_full_20251115_082341/modal_routing_val.npz
      - results/omp_transformer_speech260_trainval_split_full_20251115_082341/dictionary.npz
    generator_outputs:
      - figures/output/fig05_structure_alignment.pdf
      - figures/output/fig05_structure_alignment.tiff
      - figures/output/fig06_routing_mechanism.pdf
      - figures/output/fig06_routing_mechanism.tiff
    provenance_note: "This final manuscript figure is a composition of two upstream generator outputs. Review should catch any recomposition that harms readability or obscures the data-backed panels."

  - figure_id: fig06
    role: main
    asset: paper/figures/fig06_cross-material-universality.jpg
    asset_layer: manuscript_composite
    provenance_mode: provenance_gap
    width_mode: double
    manuscript_section: Results
